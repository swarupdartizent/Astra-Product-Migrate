# Release evaluation suite (E22.F1.S2). A synthetic shop estate upgraded to a new product version, with the
# answers a careful migration team would give. It is a test asset with known answers, not customer data.
# Changing it changes the measures: record a new baseline with a reason when you do.
name: shop-upgrade
description: Synthetic shop estate (customers, orders, lines, notes) moving to the next product version.

mapping:
  threshold: 0.8
  columns:
    - {table: dbo.Customer, name: CustomerID, type: int, nullable: false}
    - {table: dbo.Customer, name: Name, type: nvarchar, max_length: 200, nullable: false}
    - {table: dbo.Customer, name: EMail, type: varchar, max_length: 120, nullable: true}
    - {table: dbo.Customer, name: ModifiedOn, type: datetime2, nullable: false}
    - {table: dbo.Orders, name: OrderID, type: int, nullable: false}
    - {table: dbo.Orders, name: CustomerID, type: int, nullable: false}
    - {table: dbo.Orders, name: OrderDate, type: date, nullable: false}
    - {table: dbo.Orders, name: ShipDate, type: date, nullable: true}
    - {table: dbo.Orders, name: Total, type: decimal, nullable: false}
    - {table: dbo.Orders, name: LegacyFlag, type: char, max_length: 1, nullable: true}
    - {table: dbo.OrderLine, name: LineID, type: int, nullable: false}
    - {table: dbo.OrderLine, name: OrderID, type: int, nullable: false}
    - {table: dbo.OrderLine, name: Amount, type: decimal, nullable: false}
    - {table: dbo.ClientNote, name: NoteID, type: int, nullable: false}
    - {table: dbo.ClientNote, name: NoteText, type: nvarchar, max_length: 2000, nullable: true}
  targets:
    - schema: dbo
      name: Customer
      concept: shop.customer
      columns:
        - {name: CustomerID, type: int, nullable: false}
        - {name: Name, type: nvarchar(100), nullable: false}
        - {name: Email, type: varchar(120)}
        - {name: ModifiedOn, type: datetime2}
    - schema: dbo
      name: SalesOrder
      concept: shop.order
      columns:
        - {name: OrderID, type: int, nullable: false}
        - {name: CustomerID, type: int, nullable: false}
        - {name: OrderDate, type: date}
        - {name: ShippedOn, type: date}
        - {name: Total, type: decimal(12,2)}
    - schema: dbo
      name: OrderLine
      columns:
        - {name: LineID, type: int, nullable: false}
        - {name: OrderID, type: int}
        - {name: Amount, type: decimal(12,2)}
    - schema: dbo
      name: CustomerNote
      columns:
        - {name: NoteID, type: int, nullable: false}
        - {name: Body, type: nvarchar(max)}
  delta_tables: {dbo.orders: dbo.salesorder}
  entities:
    dbo.customer: {concept: shop.customer, attributes: {name: Name}}
    dbo.orders: {concept: shop.order, attributes: {ship_date: ShipDate}}
  precedents:
    dbo.clientnote.notetext: [{target: {column: Body}}]
  expected:
    dbo.customer.customerid: dbo.Customer.CustomerID
    dbo.customer.name: dbo.Customer.Name
    dbo.customer.email: dbo.Customer.Email
    dbo.customer.modifiedon: dbo.Customer.ModifiedOn
    dbo.orders.orderid: dbo.SalesOrder.OrderID
    dbo.orders.customerid: dbo.SalesOrder.CustomerID
    dbo.orders.orderdate: dbo.SalesOrder.OrderDate
    dbo.orders.shipdate: dbo.SalesOrder.ShippedOn
    dbo.orders.total: dbo.SalesOrder.Total
    dbo.orders.legacyflag: null
    dbo.orderline.lineid: dbo.OrderLine.LineID
    dbo.orderline.orderid: dbo.OrderLine.OrderID
    dbo.orderline.amount: dbo.OrderLine.Amount
    dbo.clientnote.noteid: dbo.CustomerNote.NoteID
    dbo.clientnote.notetext: dbo.CustomerNote.Body

configuration:
  design:
    configuration_areas:
      - {key: regions, label: Regional settings, source_kinds: [region_setting], method: api}
      - {key: catalogue, label: Product catalogue, source_kinds: [product], method: import_file}
    retirements:
      - object_type: workflow
        when: {desktop_only: true}
        replacement: Rebuild the step as a browser task in the target's workflow designer.
        source: {reference: fixture}
        confidence: reported
  objects:
    - {type: workflow, name: PrintLabels, detail: {desktop_only: 1}}
    - {type: workflow, name: ApproveRefund, detail: {desktop_only: 0}}
  items:
    - {kind: region_setting, key: "EU:TAX", name: TAX, scope: EU, definition: {vat: 20}}
    - {kind: region_setting, key: "US:TAX", name: TAX, scope: US, definition: {vat: 0}}
    - {kind: product, key: "P1", name: Widget, definition: {lob: retail}}
    - {kind: workflow, key: PrintLabels, name: PrintLabels, definition: [{seq: 1, action: print}]}
    - {kind: workflow, key: ApproveRefund, name: ApproveRefund, definition: [{seq: 1, action: approve}]}
  expected:
    "region_setting:eu:tax": "area:regions"
    "region_setting:us:tax": "area:regions"
    "product:p1": "area:catalogue"
    "workflow:printlabels": retire
    "workflow:approverefund": blocked   # no configuration area for workflows: blocked, never guessed

code:
  cases:
    - name: dbo.usp_Notify
      kind: procedure
      sql: "CREATE PROCEDURE dbo.usp_Notify(IN @id INT) BEGIN MESSAGE 'notify' TO CLIENT; CALL dbo.usp_Log(@id); END"
      review: false
      contains: [PRINT, EXEC]
    - name: dbo.fn_Today
      kind: function
      sql: "CREATE FUNCTION dbo.fn_Today() RETURNS DATE BEGIN RETURN TODAY(); END"
      review: false
      contains: ["CAST(GETDATE() AS date)"]
      absent: ["TODAY("]
    - name: dbo.fn_Upper
      kind: function
      sql: "CREATE FUNCTION dbo.fn_Upper(IN @s VARCHAR(20)) RETURNS VARCHAR(20) BEGIN RETURN UCASE(SUBSTR(@s, 1, 3)); END"
      review: false
      contains: ["UPPER(", "SUBSTRING("]
    - name: dbo.usp_Resume
      kind: procedure
      sql: "CREATE PROCEDURE dbo.usp_Resume() ON EXCEPTION RESUME BEGIN UPDATE dbo.Orders SET Total = 0; END"
      review: true
    - name: dbo.usp_Loop
      kind: procedure
      sql: "CREATE PROCEDURE dbo.usp_Loop() BEGIN FOR l AS c CURSOR FOR SELECT OrderID FROM dbo.Orders DO MESSAGE 'x'; END FOR; END"
      review: true
    - name: dbo.fn_Pick
      kind: function
      sql: "CREATE FUNCTION dbo.fn_Pick(IN @a INT) RETURNS INT BEGIN RETURN IFNULL(@a, 0, 1); END"
      review: true
    - name: dbo.usp_Raise
      kind: procedure
      sql: "CREATE PROCEDURE dbo.usp_Raise() BEGIN SIGNAL user_error; END"
      review: true

planning:
  elements:
    - {key: "table:dbo.customer", kind: table, stream: data, element: dbo.Customer,
       delta: {group: unchanged, origin: standard, source: dbo.Customer, target: dbo.Customer}, expected: migrate}
    - {key: "table:dbo.orders", kind: table, stream: data, element: dbo.Orders,
       delta: {group: renamed_or_moved, origin: standard, source: dbo.Orders, target: dbo.SalesOrder}, expected: migrate}
    - {key: "table:dbo.oldprices", kind: table, stream: data, element: dbo.OldPrices, usage: {reads: 40, writes: 0},
       delta: {group: removed_in_target, origin: standard, source: dbo.OldPrices}, expected: archive}
    - {key: "table:dbo.clientnote", kind: table, stream: customizations, element: dbo.ClientNote,
       usage: {reads: 5, writes: 9}, delta: {group: removed_in_target, origin: customer_specific,
       source: dbo.ClientNote}, expected: rebuild}
    - {key: "table:dbo.scratch", kind: table, stream: data, element: dbo.Scratch,
       usage: {unused: true, reads: 0, writes: 0, executions: 0}, window_days: 90, expected: retire}
    - {key: "interface:program:billing", kind: interface, stream: integrations, element: Billing,
       props: {kind: program}, expected: rebuild}
    - {key: "view:dbo.vopen", kind: view, stream: reports, element: dbo.vOpen, expected: rebuild}
    - {key: "platform:source", kind: platform, stream: platform, element: "database engine 16",
       expected: replace_with_standard}
    - {key: "procedure:dbo.usp_calc", kind: procedure, stream: customizations, element: dbo.usp_Calc,
       delta_scope: true, expected: rebuild}
  graphs:
    - nodes: [a, b, c, d, e]
      edges: [[a, b], [b, c], [c, a], [d, e]]
      cycles: [[a, b, c]]
    - nodes: [p, q, r, s]
      edges: [[p, q], [q, p], [r, s], [s, r], [q, r]]
      cycles: [[p, q], [r, s]]

compliance:
  controls:
    - {id: FIN-SOD-01, type: approval, applies_to: [mapping, transformation], compliance_critical: true,
       two_person_approval: true}
    - {id: CHG-01, type: approval, applies_to: [conversion_script], compliance_critical: false,
       two_person_approval: false, min_approvers: 2}
    - {id: DOC-01, type: approval, applies_to: [report]}
    - {id: RET-01, type: retention, applies_to: [mapping]}
  expected:
    mapping: {level: critical, approvals: 2}
    transformation: {level: critical, approvals: 2}
    conversion_script: {level: relevant, approvals: 2}
    report: {level: relevant, approvals: 1}
    retirement: {level: none, approvals: 1}
    decision: {level: none, approvals: 1}

review:
  items:
    - {id: crit-high, risk: critical, compliance: critical, confidence: 0.4, controls: [FIN-SOD-01]}
    - {id: high-crit, risk: high, compliance: critical, confidence: 0.5, controls: [FIN-SOD-01]}
    - {id: high-none, risk: high, compliance: none, confidence: 0.9}
    - {id: med-rel-low, risk: medium, compliance: relevant, confidence: 0.2, controls: [DOC-01]}
    - {id: med-none, risk: medium, compliance: none}
    - {id: low-none, risk: low, compliance: none, confidence: 0.95}
  expected_order: [crit-high, high-crit, high-none, med-rel-low, med-none, low-none]
  patterns:
    - {id: t1, prefix: "conversion:trigger", reasons: ["BEFORE trigger 'dbo.trg_A' has no direct equivalent (line 12)"]}
    - {id: t2, prefix: "conversion:trigger", reasons: ["BEFORE trigger 'dbo.trg_Other' has no direct equivalent (line 40)"]}
    - {id: c1, prefix: "conversion:procedure", reasons: ["FOR ... CURSOR loops need a set-based rewrite"]}
    - {id: c2, prefix: "conversion:procedure", reasons: ["FOR ... CURSOR loops need a set-based rewrite"]}
    - {id: c3, prefix: "conversion:procedure", reasons: ["ON EXCEPTION RESUME has no equivalent"]}
  pattern_groups: [[t1, t2], [c1, c2], [c3]]

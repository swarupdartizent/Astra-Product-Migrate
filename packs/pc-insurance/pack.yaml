adds:
  rules:
    - id: PC-POLICY-TERM
      statement: A policy term cannot end before it starts.
      applies_to: [pc.policy]
      severity: blocking
      check: {kind: order, concept: pc.policy, first: effective_date, second: expiration_date}
    - id: PC-CLAIM-IN-FORCE
      statement: A claim must link to a policy that was in force on the loss date.
      applies_to: [pc.claim]
      severity: blocking
      check: {kind: within, concept: pc.claim, date: loss_date, relation: policy, start: effective_date, end: expiration_date}
    - id: PC-SPLIT-RECONCILE
      statement: The premium shares of all carriers on a policy must add up to the policy's written premium, to the cent.
      applies_to: [pc.carrier_split, pc.policy]
      severity: blocking
      check: {kind: sum_equals, concept: pc.policy, total: written_premium, child_concept: pc.carrier_split, child_relation: policy, part: premium_share}
    - id: PC-INVOICE-RECONCILE
      statement: An invoice's total must equal the sum of its premium, tax and fee lines, to the cent.
      applies_to: [pc.invoice, pc.invoice_line]
      severity: blocking
      check: {kind: sum_equals, concept: pc.invoice, total: total_amount, child_concept: pc.invoice_line, child_relation: invoice, part: amount}
    - id: PC-COMMISSION-SPLIT-RECONCILE
      statement: The sub-producer splits of a commission must add up to the commission amount, to the cent.
      applies_to: [pc.commission, pc.commission_split]
      severity: blocking
      check: {kind: sum_equals, concept: pc.commission, total: amount, child_concept: pc.commission_split, child_relation: commission, part: amount}
    - id: PC-RECONCILE-TO-CENT
      statement: Premium, taxes, fees and commissions must reconcile to the cent between source and target.
      applies_to: [pc.policy, pc.invoice, pc.surplus_lines_tax, pc.stamping_fee, pc.policy_fee, pc.inspection_fee, pc.commission]
      severity: blocking
    - id: PC-OPEN-ITEMS-CARRY-OVER
      statement: Open items, unapplied cash and in-force instalments must carry over unchanged.
      applies_to: [pc.open_item, pc.unapplied_cash, pc.instalment]
      severity: blocking
    - id: PC-BORDEREAU-LEDGER
      statement: Premium and claims bordereaux must reconcile to the ledger for each carrier and period.
      applies_to: [pc.bordereau, pc.carrier]
      severity: blocking
    - id: PC-SL-TAX-HOME-STATE
      statement: Surplus lines premium tax is due to the insured's home state; the home state must be kept with each surplus lines policy.
      applies_to: [pc.surplus_lines_tax, pc.policy]
      severity: blocking
      sources:
        - {reference: "Nonadmitted and Reinsurance Reform Act of 2010 (Dodd-Frank Act, Title V, Subtitle B)"}
    - id: PC-BINDING-WITHIN-AUTHORITY
      statement: A policy bound under delegated authority must lie within the binding authority agreement's limits.
      applies_to: [pc.policy, pc.binding_authority_agreement]
      severity: warning
    - id: PC-PREMIUM-FINANCE-LINK
      statement: A premium finance agreement must stay linked to the policy it finances and to its lender.
      applies_to: [pc.premium_finance_agreement]
      severity: blocking
tests:
  - name: Passes the reference source adapter's synthetic golden dataset
    kind: golden_dataset
    dataset: "conceptone-source@1.0.0:synthetic-v1"
    packs: ["core-ontology@1.0.0"]

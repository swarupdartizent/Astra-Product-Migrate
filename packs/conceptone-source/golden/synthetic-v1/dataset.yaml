name: synthetic-v1
title: Synthetic ConceptOne-shaped estate, version 1
synthetic: true
description: >-
  An invented SQL Server estate shaped after public descriptions of a ConceptOne installation: 40 policies with
  multi-carrier splits, invoices with surplus lines tax and fees, commissions with sub-producer splits, claims,
  premium finance, bordereaux, 30 File Cabinet documents, user-defined tables, validation rules, workflows,
  security profiles, External Programs, procedures, triggers and views. Seeded errors, hidden rules and
  undocumented interfaces are listed in expected.yaml. It is not a copy of any customer or vendor data.
engine: sqlserver
build: [schema.sql, data.sql]
delta: delta.sql
expected: expected.yaml

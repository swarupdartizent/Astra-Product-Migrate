[project]
name = "astra-migrate"
version = "0.1.0"
description = "Astra Migrate platform: generic, pack-driven product migration and upgrade platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "pyyaml==6.0.2",
  "email-validator==2.2.0",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-http==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "opentelemetry-instrumentation-sqlalchemy==0.50b0",
  "opentelemetry-instrumentation-httpx==0.50b0",
  "dulwich==0.22.7",
  "packaging==24.2",
  "anthropic==2.4.0",
  "openai==3.44.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "types-pyyaml==6.0.12.20241230",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_migrate"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S608", "BLE001", "RUF001"]  # S608: identifiers validated; BLE001: boundary catches always log; RUF001: en dashes in user text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/astra_migrate/migrations/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the local stack (tools/dev.py up)"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['src/astra_migrate/migrations/versions/']

